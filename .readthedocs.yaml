# Required
version: 2
 
# Set the OS and Python version
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
 
# Build with MkDocs
mkdocs:
  configuration: mkdocs.yml
 
# Install dependencies
python:
  install:
    - requirements: requirements.txt
